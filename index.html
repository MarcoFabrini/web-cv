<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Curriculum</title>
  <meta name="description" content="Curriculum online">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Curriculum">
  <meta property="og:description" content="Curriculum online">
  <meta name="cv-palette" content="graphite">
  <meta name="cv-background" content="terminal">
  <meta name="theme-color" content="#121211">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f5a524'/%3E%3Ctext x='16' y='22' font-size='17' font-family='Georgia' font-style='italic' text-anchor='middle' fill='%23121211'%3Ecv%3C/text%3E%3C/svg%3E">
  <script>
    try {
      var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = t;
      var m = document.querySelector('meta[name=cv-palette]'), p = new URLSearchParams(location.search).get('palette');
      document.documentElement.dataset.palette = p && (' ' + m.dataset.options + ' ').indexOf(' ' + p + ' ') >= 0 ? p : m.content;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript><p style="padding:2rem">Serve JavaScript per visualizzare il curriculum. / JavaScript is required.</p></noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
